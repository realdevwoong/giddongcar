# 통제 구역에서 사람이 로봇 옆을 지키며 진행하는 저속 차선 주행 실험용
# robot_ip와 모션 허용/감독 확인(--enable-motion, --confirm-supervised-test,
# --watchdog-verified 또는 --confirm-attended-test-without-watchdog)은
# 안전을 위해 매번 명령행에서 지정한다. 이 파일에 넣으면 실행이 거부된다.
model: ~/vision_drive_observations/train_runs/lane_seg_v1/weights/best.pt
mode: drive
device: auto
driveable_class: driveable_area
crosswalk_action: wait-signal
crosswalk_stop_seconds: 10.0
max_linear: 0.08
max_angular: 0.40
steering_gain: 1.2
turn_radius_limit: 0.08
stop_distance: 0.35
obstacle_min_width: 0.12
corner_wall_distance: 0.45
corner_max_turn_deg: 100.0
corner_min_turn_deg: 60.0
