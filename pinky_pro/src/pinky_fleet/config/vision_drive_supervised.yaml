# 이 preset은 실제 주행을 활성화한다. 사람이 로봇 옆에서 감독하는
# 통제 구역에서만 사용한다. robot_ip는 실행 시 명령행으로 지정한다.
enable_motion: true
confirm_supervised_test: true
watchdog_verified: false
confirm_attended_test_without_watchdog: true

model: ~/vision_drive_observations/train_runs/lane_seg_v1/weights/best.pt
mode: drive
camera_port: 5000
ble_name: ""
device: auto
driveable_class: driveable_area
obstacle_classes: person,bicycle,car,motorcycle,bus,truck,bench,backpack,suitcase,chair
crosswalk_class: crosswalk
crosswalk_action: stop-then-go
crosswalk_stop_seconds: 10.0
max_linear: 0.05
max_angular: 0.25
steering_gain: 1.2
far_lookahead_weight: 0.32
turn_radius_limit: 0.12
stop_distance: 0.35
obstacle_min_width: 0.12
lane_recovery_seconds: 0.8
corner_turn_rate: 0.17
corner_turn_max_degrees: 110.0
corner_turn_timeout: 14.0
corner_turn_exit_error: 0.20
headless: false
output_dir: ~/vision_drive_observations
